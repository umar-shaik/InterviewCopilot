services:
  - type: web
    name: interview-copilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
